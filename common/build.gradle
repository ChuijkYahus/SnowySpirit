architectury {
    common(enabled_platforms.split(",")) {
        // This means map neoforge to forge
        //it.platformPackage "neoforge", "forge"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

sourceSets.create("example") {
    var main = sourceSets.main
    compileClasspath += main.compileClasspath + main.output
    runtimeClasspath += main.runtimeClasspath + main.output
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.mod_id
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}


dependencies {

    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    modApi("net.mehvahdjukaar:moonlight:${moonlight_version}") {
        transitive = true
    }


    modCompileOnly("curse.maven:farmers-delight-398521:5772720")
    modImplementation("curse.maven:entity-model-features-844662:5722728")
    modImplementation("curse.maven:entity-texture-features-fabric-568563:5000985")

    modImplementation("net.mehvahdjukaar:supplementaries:${supplementaries_version}")


}

